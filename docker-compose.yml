services:

  api:
    build: .
    container_name: ecommerce_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env.docker

  db:
    image: mysql:8.4
    container_name: ecommerce_mysql
    restart: always
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: